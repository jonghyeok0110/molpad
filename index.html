<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="분자 드로잉">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4f5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>분자 드로잉 패드</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 라이트 전용 디자인 (선결합 구조식은 흰 바탕 기준). 레이아웃: 흰 캔버스 전체 화면 + 떠 있는 패널 (왼쪽 원소 열, 오른쪽 조작 열, 아래 가운데 도구판, 오른쪽 위 라이브러리) */
:root{
  --bar:#f3f4f5; --bg:#ffffff; --panel:#ffffff; --panel-2:#f4f5f7; --line:#dde1e5; --press:#e8ebee;
  --ink:#1b1f24; --icon:#3b4148; --muted:#6c747d; --accent:#2a6ad1; --accent-soft:rgba(42,106,209,.16); --accent-ink:#ffffff;
  --erase:rgba(214,48,39,.18); --erase-line:#d63027; --shadow:0 1px 2px rgba(20,30,40,.07),0 4px 14px rgba(20,30,40,.06);
  --el-n:#2547d0; --el-o:#e0261f; --el-s:#b08a00; --el-p:#d06400; --el-hal:#13893a; --el-br:#9a3320; --el-i:#7b26aa; --el-x:#6b4fa8;
  --c-red:#d8261f; --c-blue:#2453d6; --c-green:#16883c; --c-orange:#d46a00; --c-purple:#7c34b8;
  --danger:#b3261e;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root{color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
*{box-sizing:border-box}
/* 길게 눌러도 글자 선택·확대경·콜아웃이 뜨지 않게 (입력칸과 시트 안 글은 예외) */
.app,.v3,.app *,.v3 *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,.sheet .kv dd,.sheet .tbl{-webkit-user-select:text;user-select:text}
.imgwrap img{-webkit-touch-callout:default}
/* 두 손가락 확대가 페이지 전체가 아니라 캔버스에만 걸리도록: 기본은 브라우저 제스처 끔, 스크롤이 필요한 곳만 한 방향 허용 */
html,body,.app,.v3{touch-action:none}
.sheet,.lcol .fl{touch-action:pan-y}
.vrow{touch-action:pan-x}
.ptab{touch-action:pan-x pan-y}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}

/* 상단 바 */
.bar{display:flex;align-items:center;gap:8px;background:var(--bar);border-bottom:1px solid var(--line);
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  box-shadow:0 1px 4px rgba(0,0,0,.05);position:relative;z-index:3}
.ttl{flex:1;width:0;min-width:0;max-width:520px;margin-right:auto;height:38px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink);font:inherit;font-size:17px;font-weight:500;padding:0 8px;margin-left:-8px;text-overflow:ellipsis}
.ttl:hover{border-color:var(--line)}
.ttl:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.ttl::placeholder{color:var(--muted);font-weight:400}
.ib{flex:none;width:42px;height:42px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--icon)}
.ib:hover{background:var(--press)}
.ib:disabled{opacity:.3;cursor:default;background:transparent}
.vsep{width:1px;height:26px;background:var(--line);flex:none}

/* 캔버스 */
.stage{position:relative;overflow:hidden;background:var(--bg)}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.fl{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.tb{border:0;background:transparent;color:var(--icon);cursor:pointer;display:grid;place-items:center;position:relative;border-radius:7px}
.tb:hover{background:var(--press)}
.tb[aria-pressed="true"]{background:var(--press);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tb:disabled{opacity:.3;cursor:default;background:transparent}
.tb.var::after{content:"";position:absolute;right:2px;top:2px;border-style:solid;border-width:0 6px 6px 0;border-color:transparent var(--icon) transparent transparent;opacity:.75}

.tr{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:2}
.tr .tb{width:48px;height:48px}
.tr .zg{display:flex;padding:0;overflow:hidden}
.tr .zg .tb{border-radius:0}
.tr .zg .tb+.tb{border-left:1px solid var(--line)}

.lcol{position:absolute;left:max(0px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);z-index:2;transition:transform .2s ease}
.lcol .fl{display:flex;flex-direction:column;padding:4px;border-radius:0 10px 10px 0;border-left:0;max-height:calc(100vh - 220px);overflow-y:auto;scrollbar-width:none}
.lcol .tb{width:44px;height:44px;font-size:18px;font-weight:400}
.lcol .tab{position:absolute;left:100%;top:50%;transform:translateY(-50%);width:22px;height:56px;border:1px solid var(--line);border-left:0;background:var(--panel);border-radius:0 8px 8px 0;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:0;box-shadow:var(--shadow)}
.lcol.collapsed{transform:translate(calc(-100% - 1px),-50%)}
.lcol.collapsed .tab span{display:inline-block;transform:scaleX(-1)}

.rcol{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:2}
.rcol .fl{display:flex;flex-direction:column;padding:3px;gap:2px}
.rcol .tb{width:44px;height:44px}

.bp{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(364px,calc(100% - 16px));z-index:2;overflow:hidden;padding:0}
.vrow{display:flex;gap:2px;padding:3px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);min-height:52px;align-items:center}
.vrow::-webkit-scrollbar{display:none}
.vrow .tb{flex:none;width:46px;height:44px}
.vrow .chip{flex:none;height:36px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);font-size:13.5px;cursor:pointer;white-space:nowrap}
.vrow .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vrow .act{flex:none;height:38px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);font-size:13px;cursor:pointer;white-space:nowrap;display:flex;gap:4px;align-items:center}
.vrow .act:hover,.vrow .chip:hover{border-color:var(--accent)}
.vrow .hint{font-size:12.5px;color:var(--muted);padding:0 8px;line-height:1.35}
.sw{width:22px;height:22px;border-radius:50%;display:block}
.trow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:3px;background:var(--panel-2)}
.trow+.trow{padding-top:0}
.trow .tb{height:46px}
.tb .t3{font-size:15px;font-weight:500;letter-spacing:.02em}

.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 12px;border-radius:8px;max-width:calc(100% - 140px);text-align:center;z-index:4}

/* 원소 색 */
.e-H,.e-C{color:var(--ink)} .e-N{color:var(--el-n)} .e-O{color:var(--el-o)} .e-S{color:var(--el-s)} .e-P{color:var(--el-p)} .e-F,.e-Cl{color:var(--el-hal)} .e-Br{color:var(--el-br)} .e-I{color:var(--el-i)} .e-x{color:var(--el-x)}

/* 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,22,.38);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:680px;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:10px;max-height:86%;overflow:auto}
.sheet h2{margin:0;font-size:15.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h2 button{border:0;background:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 6px}
.cap{font-size:11.5px;color:var(--muted);letter-spacing:.05em;margin-top:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{height:38px;padding:0 13px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.lnk{display:inline-flex;align-items:center;text-decoration:none;color:inherit;width:max-content}
.btn.warn{color:var(--danger);border-color:var(--danger)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.err{color:var(--danger);font-size:12.5px;min-height:1em}
textarea.code{width:100%;min-height:110px;resize:vertical;font-family:var(--f-mono);font-size:13px;line-height:1.45;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);word-break:break-all}
.field{display:flex;gap:6px}
.field input{flex:1;min-width:0;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 11px;font:inherit;font-size:15px}
.ptab{overflow:hidden;padding-bottom:2px}
.ptab .g{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:clamp(1px,.5vw,3px);width:100%}
.ptab button{height:auto;aspect-ratio:1;min-width:0;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:clamp(9px,1.9vw,13px);padding:0;overflow:hidden}
.ptab button:hover{border-color:var(--accent)}
.ptab .fm{aspect-ratio:1;min-width:0;display:grid;place-items:center;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:clamp(6px,1.25vw,10px);font-variant-numeric:tabular-nums;overflow:hidden}
.ptab .fl2{display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:var(--muted);font-size:clamp(9px,1.6vw,12px)}
.ptab .fsp{height:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;word-break:break-all}
.kv dd sub{font-size:.8em}
.tbl{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:4px 12px 4px 0;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{font-weight:500;color:var(--muted)}
.imgwrap{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;place-items:center}
.imgwrap img{max-width:100%;max-height:44vh;display:block}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
.list{display:flex;flex-direction:column;gap:2px}
.list button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:11px 8px;border-radius:8px;cursor:pointer;font-size:14.5px}
.list button:hover{background:var(--press)}
.list button small{color:var(--muted);font-size:12px}
.list button.warn{color:var(--danger)}
.seg{display:flex}
.seg .btn{border-radius:0;margin-left:-1px;position:relative}
.seg .btn:hover{z-index:1}
.seg .btn[aria-pressed="true"]{z-index:2}
.seg .btn:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg .btn:last-child{border-radius:0 8px 8px 0}
.seg .btn[aria-pressed="true"],.v3 .bar2>.btn[aria-pressed="true"]{background:var(--press);border-color:var(--icon);font-weight:500}
.chips .mine{display:inline-flex;align-items:center;gap:2px;padding-right:6px}
.chips .mine small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.chips .mine .x{margin-left:4px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:15px}
.chips .mine .x:hover{background:var(--press);color:var(--danger)}
.chk{display:flex;gap:6px;align-items:center;font-size:13.5px}
.help{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6}

/* 3D */
.v3{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;color-scheme:dark;
  --bar:#111315; --bg:#000000; --line:#2c3238; --panel-2:#1c2024; --press:#2a3036; --ink:#e6e8eb; --muted:#9aa2ab; --icon:#cdd2d8; --accent:#6ea2ff; --accent-ink:#0b1a33;
  background:var(--bg);color:var(--ink)}
.v3 .bar2{display:flex;gap:6px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bar);flex-wrap:wrap}
.v3 .bar2 .t{font-weight:600;font-size:15px;margin-right:auto}
.v3 .wrap{position:relative;flex:1;min-height:0}
#c3{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.v3 .n3 .lg{display:inline-flex;align-items:center;gap:4px;margin-left:10px;color:var(--ink);font-size:12.5px}
.v3 .n3 .lg i{width:11px;height:11px;border-radius:50%;display:block}
.v3 .n3{pointer-events:none;position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:var(--muted);right:16px}

@media (max-height:620px){ .rcol{top:68px;transform:none} .lcol{top:10px;transform:none} .lcol.collapsed{transform:translateX(calc(-100% - 1px))} .lcol .fl{max-height:calc(100vh - 140px)} }
@media (max-width:520px){ .tr .tb{width:44px;height:44px} .rcol .tb,.lcol .tb{width:42px;height:42px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="app">
  <header class="bar">
    <input class="ttl" id="docTitle" placeholder="제목 없음" aria-label="문서 제목" autocomplete="off" spellcheck="false" maxlength="80">
    <button class="ib" id="undo" aria-label="실행 취소" title="실행 취소 (Ctrl+Z)"></button>
    <button class="ib" id="redo" aria-label="다시 실행" title="다시 실행 (Ctrl+Shift+Z)"></button>
    <span class="vsep"></span>
    <button class="ib" id="fileBtn" aria-label="파일 메뉴" title="파일"></button>
  </header>

  <main class="stage" id="stage">
    <svg id="svg" aria-label="구조식 캔버스"><g id="view"><g id="shp"></g><g id="mol"></g><g id="ovl"></g></g></svg>

    <div class="tr">
      <button class="tb fl" id="tplBtn" aria-label="PubChem 검색" title="PubChem 검색"></button>
      <div class="fl zg" role="group" aria-label="화면 배율"><button class="tb" id="zoomOut" aria-label="축소" title="축소"></button><button class="tb" id="fitBtn" aria-label="화면에 맞추기" title="화면에 맞추기"></button><button class="tb" id="zoomIn" aria-label="확대" title="확대"></button></div>
    </div>

    <div class="lcol" id="lcol">
      <div class="fl" id="elCol"></div>
      <button class="tab" id="lTab" aria-label="원소 열 접기"><span>◂</span></button>
    </div>

    <div class="rcol" id="rcol"></div>

    <div class="bp fl" id="bp">
      <div class="vrow" id="vrow"></div>
      <div class="trow" id="trow1"></div>
      <div class="trow" id="trow2"></div>
    </div>

    <div class="toast" id="toast" hidden></div>
  </main>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-labelledby="sheetTitle">
    <h2><span id="sheetTitle"></span><button id="sheetClose" aria-label="닫기">×</button></h2>
    <div id="sheetBody" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>
</div>

<div class="v3" id="v3" hidden>
  <div class="bar2">
    <span class="t">3D 보기</span>
    <button class="btn" id="v3H" aria-pressed="false">수소 숨기기</button>
    <button class="btn" id="v3Spin" aria-pressed="false">자동 회전</button>
    <div class="seg" role="group" aria-label="모형"><button class="btn" id="v3bs">공-막대</button><button class="btn" id="v3line">선</button><button class="btn" id="v3sf">채움</button></div>
    <button class="btn primary" id="v3Close">닫기</button>
  </div>
  <div class="wrap"><canvas id="c3"></canvas><div class="n3" id="v3Leg" hidden></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== 분자 모델 · SMILES · 배치 (DOM 없이 동작) ===== */
const ORGANIC = new Set(['B','C','N','O','P','S','F','Cl','Br','I']);
const VAL = {H:[1],B:[3],C:[4],N:[3,5],O:[2],F:[1],Si:[4],P:[3,5],S:[2,4,6],Cl:[1],Se:[2,4,6],Br:[1],I:[1]};
/* 표준 원자량(IUPAC 축약값) · 단일 동위원소 질량(AME2016). 안정 동위원소가 없는 원소는 관례적으로 쓰는 동위원소의 질량 */

function makeMol(){ return {atoms:[], bonds:[]}; }
function adjOf(m){ const a = m.atoms.map(()=>[]); m.bonds.forEach((b,k)=>{ a[b.a].push(k); a[b.b].push(k); }); return a; }
function other(b,i){ return b.a===i ? b.b : b.a; }
function targetVal(el,base,c){ if(el==='C'||el==='Si'||el==='H') return base-Math.abs(c); if(el==='B') return base-c; return base+c; }
function defaultH(m,i,adj){
  const at=m.atoms[i], v=VAL[at.el]; if(!v) return 0;
  let used=at.r||0; for(const k of adj[i]) used+=m.bonds[k].o;
  for(const base of v){ const t=targetVal(at.el,base,at.c||0); if(t>=used){ if(at.el==='N'&&base>3&&t>used) return 0; return t-used; } }
  return 0;
}
function hCount(m,i,adj){ const at=m.atoms[i]; return at.h!=null ? at.h : defaultH(m,i,adj); }

function formula(m){
  const adj=adjOf(m), cnt={}; let chg=0;
  m.atoms.forEach((a,i)=>{ cnt[a.el]=(cnt[a.el]||0)+1; const h=hCount(m,i,adj); if(h) cnt.H=(cnt.H||0)+h; chg+=a.c||0; });
  const els=Object.keys(cnt).sort();
  let order;
  if(cnt.C){ order=['C']; if(cnt.H) order.push('H'); order=order.concat(els.filter(e=>e!=='C'&&e!=='H')); } else order=els;
  let mw=0, mono=0, unknown=false;
  for(const e of order){ const ms=MASS[e]; if(!ms){ unknown=true; continue; } mw+=ms[0]*cnt[e]; mono+=ms[1]*cnt[e]; }
  mono-=chg*0.00054858;
  return {parts:order.map(e=>[e,cnt[e]]), chg, mw, mono, unknown};
}

/* ---------- SMILES 읽기 ---------- */
function parseSmiles(str){
  const s=(str||'').trim().split(/\s+/)[0];
  if(!s) throw new Error('SMILES가 비어 있습니다.');
  const m=makeMol(), arom=[], stack=[], rings=new Map();
  let prev=null, bond=null, i=0;
  const link=(a,b,bo)=>{
    if(a===b) throw new Error('원자가 자기 자신과 결합할 수 없습니다.');
    m.bonds.push({a,b,o: bo===null ? ((arom[a]&&arom[b])?'a':1) : bo});
  };
  // 입체 정보(@/@@)를 읽으려고 원자마다 SMILES에 나온 이웃 순서를 기록한다. 대괄호 안의 H는 '앞 원자 바로 다음' 자리, 고리 번호는 숫자가 나온 자리
  const ord=[], chiAt=[];
  const add=(el,ar,c,h,chi)=>{
    const k=m.atoms.length; m.atoms.push({x:0,y:0,el,c:c||0,h:h==null?null:h}); arom.push(ar); ord[k]=[];
    if(prev!==null){ ord[prev].push(k); ord[k].push(prev); }
    if(chi){ chiAt.push([k,chi]); for(let q=0;q<(h||0);q++) ord[k].push('H'); }
    if(prev!==null) link(prev,k,bond); bond=null; prev=k;
  };
  const BO={'-':1,'=':2,'#':3,'$':3,':':'a','/':1,'\\':1};
  while(i<s.length){
    const ch=s[i];
    if(ch==='('){ if(prev===null) throw new Error((i+1)+'번째 괄호 앞에 원자가 없습니다.'); stack.push(prev); i++; continue; }
    if(ch===')'){ if(!stack.length) throw new Error((i+1)+'번째 닫는 괄호에 짝이 없습니다.'); prev=stack.pop(); i++; continue; }
    if(ch==='.'){ prev=null; bond=null; i++; continue; }
    if(ch in BO){ bond=BO[ch]; i++; continue; }
    if(ch==='['){
      const j=s.indexOf(']',i); if(j<0) throw new Error('대괄호 [ 가 닫히지 않았습니다.');
      const inner=s.slice(i+1,j);
      const mm=inner.match(/^(\d*)(\*|[A-Z][a-z]?|se|as|[bcnops])(@{0,2}(?:TH|AL|SP|TB|OH)?\d*)(H\d*)?((?:\+\+?|--?)\d*)?(?::\d+)?$/);
      if(!mm) throw new Error('대괄호 원자를 해석할 수 없습니다: ['+inner+']');
      let sym=mm[2], ar=false;
      if(sym[0]>='a'&&sym[0]<='z'){ ar=true; sym=sym[0].toUpperCase()+sym.slice(1); }
      const h=mm[4] ? (mm[4].length>1 ? +mm[4].slice(1) : 1) : 0;
      let c=0; if(mm[5]){ const sg=mm[5][0]==='+'?1:-1, rest=mm[5].replace(/[+-]/g,''); c = sg*(rest ? +rest : mm[5].length); }
      const cs=mm[3]||'', chi=/^@@|^@TH2/.test(cs)?2:/^@(TH1)?\d*$/.test(cs)&&cs?1:0;
      add(sym,ar,c,h,chi); i=j+1; continue;
    }
    if(s.startsWith('Cl',i)||s.startsWith('Br',i)){ add(s.substr(i,2),false); i+=2; continue; }
    if('BCNOPSFI'.includes(ch)){ add(ch,false); i++; continue; }
    if('bcnops'.includes(ch)){ add(ch.toUpperCase(),true); i++; continue; }
    if(ch==='*'){ add('*',false); i++; continue; }
    let num=null;
    if(ch>='0'&&ch<='9'){ num=ch; i++; }
    else if(ch==='%'){
      if(s[i+1]==='('){ const j=s.indexOf(')',i); if(j<0) throw new Error('%( 고리 번호가 닫히지 않았습니다.'); num=s.slice(i+2,j); i=j+1; }
      else { num=s.substr(i+1,2); if(!/^\d\d$/.test(num)) throw new Error('% 뒤에는 두 자리 숫자가 와야 합니다.'); i+=3; }
      num=String(+num);
    }
    if(num!==null){
      if(prev===null) throw new Error('고리 번호 '+num+' 앞에 원자가 없습니다.');
      if(rings.has(num)){
        const r=rings.get(num); rings.delete(num);
        if(m.bonds.some(b=>(b.a===r.at&&b.b===prev)||(b.b===r.at&&b.a===prev))) throw new Error('고리 번호 '+num+'이(가) 이미 있는 결합을 다시 만듭니다.');
        link(r.at,prev, bond!==null?bond:r.bo); ord[r.at][r.slot]=prev; ord[prev].push(r.at);
      } else { rings.set(num,{at:prev,bo:bond,slot:ord[prev].length}); ord[prev].push(null); }
      bond=null; continue;
    }
    throw new Error((i+1)+'번째 문자 \''+ch+'\'을(를) 해석할 수 없습니다.');
  }
  if(rings.size) throw new Error('닫히지 않은 고리 번호: '+[...rings.keys()].join(', '));
  if(stack.length) throw new Error('여는 괄호가 닫히지 않았습니다.');
  m.warn = kekulize(m,arom) ? '' : '방향족 고리의 케쿨레 구조를 찾지 못해 단일결합으로 표시했습니다.';
  m.stereo=chiAt.filter(([k])=>ord[k].length===4).map(([k,chi])=>({c:k,L:ord[k].slice(),chi}));
  return m;
}

function kekulize(m,arom){
  const ab=[]; m.bonds.forEach((b,k)=>{ if(b.o==='a') ab.push(k); });
  if(!ab.length) return true;
  const adj=adjOf(m), n=m.atoms.length;
  const need=m.atoms.map((at,i)=>{
    let used=0, na=0;
    for(const k of adj[i]){ const o=m.bonds[k].o; if(o==='a'){ used++; na++; } else used+=o; }
    if(!na) return false; const v=VAL[at.el]; if(!v) return false;
    return targetVal(at.el,v[0],at.c||0)-used-(at.h||0) >= 1;
  });
  const nb=m.atoms.map(()=>[]);
  for(const k of ab){ const b=m.bonds[k]; if(need[b.a]&&need[b.b]){ nb[b.a].push([b.b,k]); nb[b.b].push([b.a,k]); } }
  const todo=[]; for(let i=0;i<n;i++) if(need[i]) todo.push(i);
  const mate=new Int32Array(n).fill(-1), chosen=new Set(); let steps=0;
  function solve(){
    if(++steps>400000) return false;
    let best=-1, bc=1e9;
    for(const i of todo){ if(mate[i]!==-1) continue; let c=0; for(const [j] of nb[i]) if(mate[j]===-1) c++; if(c<bc){ bc=c; best=i; if(c<=1) break; } }
    if(best===-1) return true; if(bc===0) return false;
    for(const [j,k] of nb[best]){
      if(mate[j]!==-1) continue;
      mate[best]=j; mate[j]=best; chosen.add(k);
      if(solve()) return true;
      mate[best]=-1; mate[j]=-1; chosen.delete(k);
    }
    return false;
  }
  const ok=solve();
  for(const k of ab) m.bonds[k].o = ok&&chosen.has(k) ? 2 : 1;
  return ok;
}

/* ---------- SMILES 쓰기 ---------- */
function toSmiles(m,first){
  const n=m.atoms.length; if(!n) return '';
  const adj=adjOf(m), seen=new Uint8Array(n), order=new Int32Array(n).fill(-1), parent=new Int32Array(n).fill(-1);
  const atomStr=i=>{
    const at=m.atoms[i], c=at.c||0;
    if(at.el==='*'&&!c) return '*';
    if(ORGANIC.has(at.el)&&!c&&!at.r&&(at.h==null||at.h===defaultH(m,i,adj))) return at.el;
    const h=hCount(m,i,adj); let s='['+at.el;
    if(h) s+='H'+(h>1?h:'');
    if(c) s+=(c>0?'+':'-')+(Math.abs(c)>1?Math.abs(c):'');
    return s+']';
  };
  const bs=o=>o===2?'=':o===3?'#':'';
  const lab=x=>x<10?String(x):x<100?'%'+x:'%('+x+')';
  const parts=[]; let cnt=0;
  for(let s0=0;s0<n;s0++){
    if(seen[s0]) continue;
    // 성분 안에서 차수가 가장 낮은 원자에서 시작
    const comp=[s0]; seen[s0]=1;
    for(let q=0;q<comp.length;q++) for(const k of adj[comp[q]]){ const j=other(m.bonds[k],comp[q]); if(!seen[j]){ seen[j]=1; comp.push(j); } }
    let start=comp[0]; for(const v of comp) if(adj[v].length<adj[start].length) start=v;
    if(first!=null&&comp.includes(first)) start=first;
    const stk=[start]; order[start]=cnt++;
    const dfs=u=>{ for(const k of adj[u]){ const w=other(m.bonds[k],u); if(order[w]<0){ order[w]=cnt++; parent[w]=u; dfs(w); } } };
    dfs(start);
    const opens=new Map(), closes=new Map();
    for(const v of comp) for(const k of adj[v]){
      const b=m.bonds[k]; if(b.a!==v) continue;
      if(parent[b.a]===b.b||parent[b.b]===b.a) continue;
      const [x,y]=order[b.a]<order[b.b]?[b.a,b.b]:[b.b,b.a];
      if(!opens.has(x)) opens.set(x,[]); if(!closes.has(y)) closes.set(y,[]);
      opens.get(x).push(k); closes.get(y).push(k);
    }
    const free=[]; let top=0; const label=new Map();
    const take=()=>{ if(free.length){ free.sort((a,b)=>a-b); return free.shift(); } return ++top; };
    const w=u=>{
      let s=atomStr(u);
      for(const k of closes.get(u)||[]){ const l=label.get(k); label.delete(k); s+=lab(l); free.push(l); }
      const op=(opens.get(u)||[]).slice().sort((a,b)=>order[other(m.bonds[a],u)]-order[other(m.bonds[b],u)]);
      for(const k of op){ const l=take(); label.set(k,l); s+=bs(m.bonds[k].o)+lab(l); }
      const kids=adj[u].map(k=>[k,other(m.bonds[k],u)]).filter(([k,v])=>parent[v]===u).sort((a,b)=>order[a[1]]-order[b[1]]);
      kids.forEach(([k,v],idx)=>{ const p=bs(m.bonds[k].o)+w(v); s+= idx===kids.length-1 ? p : '('+p+')'; });
      return s;
    };
    parts.push(w(start));
  }
  return parts.join('.');
}

/* ---------- 거리 기반 배치 (stress majorization) ---------- */
function components(n,nb){
  const id=new Int32Array(n).fill(-1), list=[];
  for(let s=0;s<n;s++){ if(id[s]>=0) continue; const c=[s]; id[s]=list.length;
    for(let q=0;q<c.length;q++) for(const j of nb[c[q]]) if(id[j]<0){ id[j]=list.length; c.push(j); }
    list.push(c); }
  return list;
}
function hops(n,nb){
  const H=new Int32Array(n*n).fill(-1), q=new Int32Array(n);
  for(let s=0;s<n;s++){ let h=0,t=0; q[t++]=s; H[s*n+s]=0;
    while(h<t){ const u=q[h++], d=H[s*n+u]; for(const v of nb[u]) if(H[s*n+v]<0){ H[s*n+v]=d+1; q[t++]=v; } } }
  return H;
}
function rand(seed){ let x=seed>>>0||1; return ()=>{ x^=x<<13; x^=x>>>17; x^=x<<5; return ((x>>>0)/4294967296); }; }

// T: 목표 거리 행렬, W: 가중치(0이면 무시). local: 이웃 근처만 + 겹침 방지
function stress(n,T,D,X,iters,rmin){
  const acc=new Float64Array(D);
  for(let it=0;it<iters;it++){
    for(let i=0;i<n;i++){
      let sw=0; acc.fill(0);
      for(let j=0;j<n;j++){ if(j===i) continue;
        let t=T[i*n+j]; let dd=0;
        for(let d=0;d<D;d++){ const v=X[i*D+d]-X[j*D+d]; dd+=v*v; }
        let dist=Math.sqrt(dd)||1e-6;
        if(t<0){ if(!rmin||dist>=rmin) continue; t=rmin; }
        const w=1/(t*t);
        for(let d=0;d<D;d++) acc[d]+=w*(X[j*D+d]+t*(X[i*D+d]-X[j*D+d])/dist);
        sw+=w;
      }
      if(sw>0) for(let d=0;d<D;d++) X[i*D+d]=acc[d]/sw;
    }
  }
}
function mdsInit(n,T,D,seed){
  const X=new Float64Array(n*D); if(n<2) return X;
  const B=new Float64Array(n*n), rm=new Float64Array(n); let all=0;
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){ const t=T[i*n+j]; const v=t*t; B[i*n+j]=v; rm[i]+=v/n; all+=v/(n*n); }
  for(let i=0;i<n;i++) for(let j=0;j<n;j++) B[i*n+j]=-0.5*(B[i*n+j]-rm[i]-rm[j]+all);
  const r=rand(seed), vecs=[];
  for(let d=0;d<D;d++){
    let v=new Float64Array(n); for(let i=0;i<n;i++) v[i]=r()-0.5; let lam=0;
    for(let it=0;it<120;it++){
      const w=new Float64Array(n);
      for(let i=0;i<n;i++){ let s=0; const o=i*n; for(let j=0;j<n;j++) s+=B[o+j]*v[j]; w[i]=s; }
      for(const u of vecs){ let p=0; for(let i=0;i<n;i++) p+=w[i]*u.v[i]; for(let i=0;i<n;i++) w[i]-=p*u.v[i]; }
      let nn=0; for(let i=0;i<n;i++) nn+=w[i]*w[i]; nn=Math.sqrt(nn)||1; lam=0;
      for(let i=0;i<n;i++){ lam+=v[i]*w[i]; v[i]=w[i]/nn; }
    }
    vecs.push({v,lam});
    const sc=Math.sqrt(Math.max(lam,1e-6));
    for(let i=0;i<n;i++) X[i*D+d]=v[i]*sc+(r()-0.5)*0.05;
  }
  return X;
}

// 2D 배치: 고리가 많은 우리(cage)형 성분은 3D로 배치해 투영
function layout2D(m){
  const n=m.atoms.length; if(!n) return;
  const adj=adjOf(m), nb=m.atoms.map((_,i)=>adj[i].map(k=>other(m.bonds[k],i)));
  const comps=components(n,nb); let xoff=0; const placed=[];
  for(const c of comps){
    const cn=c.length, loc=new Map(c.map((v,i)=>[v,i]));
    const lnb=c.map(v=>nb[v].map(w=>loc.get(w)));
    let E=0; for(const v of c) E+=nb[v].length; E/=2;
    const cage = cn>=12 && (E-cn+1) > cn/4;
    let P;
    if(cage){
      const X=embed3DGraph(cn,lnb,c.map(v=>m.atoms[v].el),null);
      P=new Float64Array(cn*2); for(let i=0;i<cn;i++){ P[i*2]=X[i*3]; P[i*2+1]=X[i*3+1]; }
      // 결합 평균 길이를 1로
      let s=0,k=0; for(let i=0;i<cn;i++) for(const j of lnb[i]) if(j>i){ s+=Math.hypot(X[i*3]-X[j*3],X[i*3+1]-X[j*3+1],X[i*3+2]-X[j*3+2]); k++; }
      const f=k?k/s:1; for(let i=0;i<P.length;i++) P[i]*=f;
    } else {

function tap(hit){

  case 'hand': return false;

    const f=fragOf(hit); sel=f; updateCopy(); render(); return false; }
  case 'atom': { const el=V.atom;
    if(hit.type==='atom'){ const a=M.atoms[hit.i];
      if(el==='C'&&a.el==='C'&&!a.lab&&!a.ab){ pushUndo(); a.lab=1; return true; }
      if(a.el===el&&!a.c&&!a.ab){ pushUndo(); const j=extendFrom(hit.i,1,el==='H'?'C':el); if(el==='C'&&M.atoms[j]) M.atoms[j].lab=1; return true; }

    e.preventDefault(); el.scrollLeft+=d*(e.deltaMode===1?16:e.deltaMode===2?el.clientWidth:1); },{passive:false});
  let st=null, moved=false;
  el.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse'||e.button!==0) return; st={x:e.clientX,l:el.scrollLeft,id:e.pointerId}; moved=false; });
  el.addEventListener('pointermove',e=>{ if(!st||e.pointerId!==st.id) return; const dx=e.clientX-st.x;
    if(!moved&&Math.abs(dx)>5){ moved=true; try{ el.setPointerCapture(st.id); }catch(_){} el.style.cursor='grabbing'; }

  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
